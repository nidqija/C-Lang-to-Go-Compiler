name: Auto Deploy C2Go on Debian

on:
  push:
    branches: [ master ]
  schedule:
    # ⏰ Cron schedule: Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

# Grant permissions to create releases & tags
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Executes directly on your Debian machine

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git log changelog

      - name: Generate Version & Release Notes
        id: versioning
        run: |
          # 1. Compute dynamic build version
          DATE_TAG=$(date +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_VERSION="v0.2.0-${DATE_TAG}-${SHORT_SHA}"
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV

          # 2. Extract recent commit changelog into release notes
          echo "### 🚀 What's Changed in $BUILD_VERSION" > release_notes.md
          echo "" >> release_notes.md
          git log -n 15 --pretty=format:"* %s ([%h](https://github.com/nidqija/C-Lang-to-Go-Compiler/commit/%H)) by @%an" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "*Automated build & release generated by GitHub Actions cron.*" >> release_notes.md

      - name: Build C2Go Compiler (GCC)
        run: |
          gcc -Wall -Wextra -std=c11 -Iinclude compiler/main.c compiler/arena.c compiler/lexer.c compiler/ast.c compiler/parser.c compiler/codegen.c -o c2go
          chmod +x c2go
          sudo cp c2go /usr/local/bin/c2go
          echo "✅ c2go compiler built and deployed locally"

      - name: Build Web Frontend (SvelteKit)
        run: |
          cd web
          npm install
          npm run build
          echo "✅ SvelteKit frontend built successfully"

      - name: Build Go API Backend
        run: |
          cd web-server
          go build -o c2go-server server.go
          chmod +x c2go-server
          echo "✅ Go API server compiled into standalone 'c2go-server' binary"

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uses GitHub CLI (pre-installed on runners) to publish release with assets
          gh release create "$BUILD_VERSION" \
            --title "C2Go $BUILD_VERSION" \
            --notes-file release_notes.md \
            c2go \
            web-server/c2go-server || echo "Release $BUILD_VERSION already exists"